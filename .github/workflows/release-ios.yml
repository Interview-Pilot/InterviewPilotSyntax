name: Release Apple XCFramework

on:
  push:
    tags:
      - 'apple-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: >
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios,
            aarch64-apple-darwin,
            x86_64-apple-darwin

      - name: Test Rust core and FFI
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify Apple XCFramework
        run: ./scripts/build-apple-xcframework.sh

      - name: Package XCFramework
        run: |
          cd platforms/apple
          ditto -c -k --sequesterRsrc --keepParent \
            InterviewPilotSyntax.xcframework \
            InterviewPilotSyntax.xcframework.zip
          echo "BINARY_CHECKSUM=$(swift package compute-checksum InterviewPilotSyntax.xcframework.zip)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            platforms/apple/InterviewPilotSyntax.xcframework.zip \
            --verify-tag \
            --generate-notes

      - name: Publish immutable Swift package branch
        env:
          PACKAGE_BRANCH: spm/${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          package = Path("Package.swift")
          source = package.read_text()
          binary_target = f'''.binaryTarget(
              name: "InterviewPilotSyntaxFFI",
              url: "https://github.com/Interview-Pilot/InterviewPilotSyntax/releases/download/{os.environ["GITHUB_REF_NAME"]}/InterviewPilotSyntax.xcframework.zip",
              checksum: "{os.environ["BINARY_CHECKSUM"]}"
          )'''
          updated, count = re.subn(
              r'\.binaryTarget\(\s*name: "InterviewPilotSyntaxFFI",\s*path: "platforms/apple/InterviewPilotSyntax\.xcframework"\s*\)',
              binary_target,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Local InterviewPilotSyntaxFFI binary target was not found exactly once")
          package.write_text(updated)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Publish Swift package for $GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$PACKAGE_BRANCH"
