name: Release Android AAR

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.3.11579264'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: >
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test and build Android AAR
        run: |
          cargo test --workspace --all-targets --locked
          ./scripts/build-android-aar.sh
          cd dist/android
          sha256sum InterviewPilotSyntax.aar > InterviewPilotSyntax.aar.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/android/InterviewPilotSyntax.aar \
            dist/android/InterviewPilotSyntax.aar.sha256 \
            --verify-tag \
            --generate-notes
