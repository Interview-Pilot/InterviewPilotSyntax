name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: >
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios

      - name: Test Rust core and FFI
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify iOS XCFramework
        run: ./scripts/build-ios-xcframework.sh

      - name: Compile Swift package and tests
        run: |
          swift build --disable-sandbox --build-tests \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
