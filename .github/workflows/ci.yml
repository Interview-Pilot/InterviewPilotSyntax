name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: >
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios,
            aarch64-apple-darwin,
            x86_64-apple-darwin

      - name: Test Rust core and FFI
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify Apple XCFramework
        run: ./scripts/build-apple-xcframework.sh

      - name: Compile Swift package and tests
        run: |
          swift build --disable-sandbox --build-tests \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift test --disable-sandbox

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.3.11579264'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: >
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test Rust and build Android AAR
        run: |
          cargo test --workspace --all-targets --locked
          ./scripts/build-android-aar.sh
